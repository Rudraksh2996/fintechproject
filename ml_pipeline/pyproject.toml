[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ml-pipeline"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "neo4j==5.28.2",
    "networkx==3.5",
    "pandas==2.3.3",
    "pyarrow==20.0.0",
    "pydantic-settings==2.12.0",
]

[project.scripts]
mule = "ml_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_pipeline"]
