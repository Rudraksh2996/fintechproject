[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "edgar-pipeline"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["SQLAlchemy==2.0.44", "alembic==1.17.2", "psycopg[binary]==3.2.12", "asyncpg==0.31.0", "pydantic==2.12.4", "pydantic-settings==2.12.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/edgar_pipeline"]
