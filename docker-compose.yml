services:
  postgres:
    mem_limit: 512m
    command: ["postgres", "-c", "shared_buffers=128MB"]
    image: postgres:16.11-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?Set POSTGRES_APP_USER in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
      WORKBENCH_RO_PASSWORD: ${WORKBENCH_RO_PASSWORD:?Set WORKBENCH_RO_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
  neo4j:
    mem_limit: 1280m
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:?Set NEO4J_AUTH in .env}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4jdata:/data
      - ./infra/neo4j:/schema:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'auth="$${NEO4J_AUTH}"; cypher-shell -u "$${auth%%/*}" -p "$${auth#*/}" "RETURN 1"'
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  bootstrap:
    image: fintech-platform-bootstrap:latest
    pull_policy: never
    mem_limit: 2304m
    cpus: 4
    build:
      context: .
      dockerfile: infra/docker/bootstrap.Dockerfile
    env_file: .env
    environment:
      TORCH_NUM_THREADS: ${TORCH_NUM_THREADS:-4}
      NEO4J_URI: bolt://neo4j:7687
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - artifacts:/artifacts
    command: [python, /platform/bootstrap.py]
    depends_on:
      postgres: {condition: service_healthy}
      neo4j: {condition: service_healthy}
  backend:
    image: fintech-platform-bootstrap:latest
    pull_policy: never
    mem_limit: 1450m
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      NEO4J_URI: bolt://neo4j:7687
      EDGAR_CACHE: /cache
    volumes:
      - artifacts:/artifacts:ro
      - edgar_cache:/cache
    command: [uvicorn, "app.main:create_app", --factory, --host, 0.0.0.0, --port, "8000"]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import json,urllib.request; assert json.load(urllib.request.urlopen('http://localhost:8000/api/v1/health'))['status']=='ok'"]
      interval: 10s
      timeout: 5s
      retries: 20
  streamlit:
    build:
      context: .
      dockerfile: infra/docker/streamlit.Dockerfile
    mem_limit: 512m
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      WORKBENCH_RO_PASSWORD: ${WORKBENCH_RO_PASSWORD}
      DEMO_MODE: ${DEMO_MODE:-true}
      GATEWAY_URL: http://backend:8000
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; assert urllib.request.urlopen('http://localhost:8501/workbench/_stcore/health').status==200"]
      interval: 10s
      retries: 20
  schema:
    mem_limit: 384m
    profiles: [tools]
    build:
      context: .
      dockerfile: infra/docker/schema.Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      NEO4J_URI: bolt://neo4j:7687
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    command: [/platform/.venv/bin/alembic, upgrade, head]

volumes:
  pgdata:
  neo4jdata:
  artifacts:
  edgar_cache:
